name: Build merged feed

on:
  schedule:
    # UTC 时间。下面这行是每小时的第 5 分钟跑一次。
    # 如果只想早上跑，比如北京时间 6:30，就写 "30 22 * * *"（UTC 22:30 = 次日 06:30 +08）
    - cron: "5 * * * *"
  workflow_dispatch:   # 允许在网页上手动点一次，方便调试
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Merge feeds
        run: |
          python merge_feeds.py \
            --opml feeds.opml \
            --out public/feed.xml \
            --headlines \
            --hours 24 \
            --per-feed 2 \
            --limit 40 \
            --title "我的聚合早报"

      - name: Merge Zaobao feed
        run: |
          python merge_feeds.py \
            --opml feeds.opml \
            --folder 联合早报 \
            --out public/zaobao.xml \
            --headlines \
            --group-by-source \
            --hours 24 \
            --per-feed 5 \
            --limit 10 \
            --title "联合早报 每日十条"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
